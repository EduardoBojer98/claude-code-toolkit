# ccfb provider and model registry (repository-managed, no secrets).
#
# Override anything in ~/.config/claude-fallback/config.toml (same structure; tables are
# merged key by key). Keys come from environment variables or ~/.config/claude-fallback/.env.
#
# Every limit below is copied from the cited source on the date shown. Free tiers change:
# treat them as starting points. The gateway also learns from real 429 responses and from
# rate-limit headers when a provider sends them. `ccfb models --refresh` re-reads context
# windows from provider APIs that publish them.
#
# kind = "anthropic" -> provider speaks the Anthropic Messages API (requests relayed, model swapped)
# kind = "openai"    -> provider speaks OpenAI Chat Completions (requests translated)

[fallback]
enabled = true                  # false = pure pass-through to Claude, never fall back
# Order of preference. Providers not listed keep their registry priority after these.
preferred_providers = ["openrouter", "gemini"]
excluded_providers = []
excluded_models = []
min_context_tokens = 64000      # never pick a model with a smaller (documented) window
max_attempts = 4                # providers tried per request before giving up
redact_secrets = true           # mask obvious API keys/private keys before sending to a free provider
request_timeout_seconds = 300
connect_timeout_seconds = 15
sticky_minutes = 30             # keep the same fallback model while it works, to avoid needless switching

[recovery]
mode = "auto"                   # "auto": return to Claude when it answers again; "manual": wait for `ccfb resume`
probe_interval_minutes = 15     # minimum time between attempts to send a request to Claude while limited
turn_boundary_only = true       # only try Claude again at the start of a new user turn, not mid tool loop

[claude]
upstream = "https://api.anthropic.com"   # pass-through target (must be an Anthropic host)

[gateway]
host = "127.0.0.1"
port = 8787
log_level = "info"              # "debug" adds routing details (never secrets or prompt text)

# ---------------------------------------------------------------------------------------
[providers.openrouter]
kind = "anthropic"
base_url = "https://openrouter.ai/api"
key_env = "OPENROUTER_API_KEY"
enabled = true
free_kind = "free-tier"         # free-tier | trial | local
signup = "https://openrouter.ai/keys"
privacy = "Free model endpoints may let the model provider log or train on prompts. Check your OpenRouter privacy settings before sending client code."
# Source: https://openrouter.ai/docs/api-reference/limits (checked 2026-10-22).
# Shared across all :free models on the account: 20 req/min; 50 req/day, or 1000 req/day once
# the account has bought at least 10 credits (one-time purchase, still not a subscription).
limits = { rpm = 20, rpd = 50, day_reset = "utc" }
# Compatibility note: OpenRouter documents Claude Code via its Anthropic-compatible endpoint and
# says non-Anthropic models "may not work correctly". Free models are therefore checked by the
# router for tool support and fail over to the next candidate on errors.
models_endpoint = "https://openrouter.ai/api/v1/models"

[[providers.openrouter.models]]
id = "minimax/minimax-m3.1-flash:free"
context = 1000000
tools = true
vision = false
roles = ["main", "small"]
priority = 10
source = "costgoat.com/pricing/openrouter-free-models (2026-10-21): free, 1.0M context, tool calling; listed as best coding pick"

[[providers.openrouter.models]]
id = "nvidia/nemotron-3.5-super-vl:free"
context = 1000000
tools = true
vision = true
roles = ["main"]
priority = 20
source = "costgoat.com/pricing/openrouter-free-models (2026-10-21): free, 1.0M context, tool calling, vision"

[[providers.openrouter.models]]
id = "cohere/north-mini-code:free"
context = 256000
tools = true
vision = false
roles = ["main", "small"]
priority = 30
source = "costgoat.com/pricing/openrouter-free-models (2026-10-21): free, 256K context, tool calling"

# ---------------------------------------------------------------------------------------
[providers.gemini]
kind = "openai"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
key_env = "GEMINI_API_KEY"
enabled = true
free_kind = "free-tier"
signup = "https://aistudio.google.com/apikey"
privacy = "On the free tier Google may use prompts and outputs to improve its products. Don't send client code you may not share."
# Source: https://ai.google.dev/gemini-api/docs/rate-limits (checked 2026-10-22). Exact free
# limits are only shown per project in AI Studio, so none are pre-enforced here except the
# conservative per-minute value; 429s set the real cooldowns. Daily quotas reset at midnight
# Pacific time (same page).
limits = { rpm = 10, day_reset = "pacific" }
models_endpoint = "https://generativelanguage.googleapis.com/v1beta/models"

[[providers.gemini.models]]
id = "gemini-3.8-flash"
context = 1000000
context_verified = false        # `ccfb models --refresh` replaces this with the API's inputTokenLimit
tools = true
vision = true
roles = ["main"]
priority = 40
source = "https://ai.google.dev/gemini-api/docs/models (2026-10-22): stable, recommended for new projects; tools via OpenAI compatibility https://ai.google.dev/gemini-api/docs/openai"

[[providers.gemini.models]]
id = "gemini-3.5-flash-lite"
context = 1000000
context_verified = false
tools = true
vision = true
roles = ["small", "main"]
priority = 50
source = "https://ai.google.dev/gemini-api/docs/models (2026-10-22): stable, recommended lightweight model"

# ---------------------------------------------------------------------------------------
[providers.cerebras]
kind = "openai"
base_url = "https://api.cerebras.ai/v1"
key_env = "CEREBRAS_API_KEY"
enabled = false                 # free TRIAL, not a permanent free tier: enable deliberately
free_kind = "trial"
signup = "https://cloud.cerebras.ai"
privacy = "Check Cerebras's current data-use terms before sending client code."
# Source: https://inference-docs.cerebras.ai/support/rate-limits (checked 2026-10-22), Free Trial tier.
limits = { rpm = 5, tpm = 30000, tpd = 1000000, day_reset = "utc" }

[[providers.cerebras.models]]
id = "gpt-oss-120b"
context = 65536
context_verified = false
tools = true
vision = false
roles = ["main", "small"]
priority = 60
source = "Cerebras rate-limits page (2026-10-22): Free Trial 5 RPM, 30K uncached TPM, 1M TPD. Context on the trial not documented; 64K assumed"

# ---------------------------------------------------------------------------------------
[providers.groq]
kind = "openai"
base_url = "https://api.groq.com/openai/v1"
key_env = "GROQ_API_KEY"
enabled = false
free_kind = "free-tier"
signup = "https://console.groq.com/keys"
incompatible_reason = "Free tier allows 8K tokens per minute; a single Claude Code request (system prompt + tool definitions) is usually larger. Source: https://console.groq.com/docs/rate-limits (2026-10-22)"
limits = { rpm = 30, rpd = 1000, tpm = 8000, tpd = 200000, day_reset = "utc" }

[[providers.groq.models]]
id = "openai/gpt-oss-120b"
context = 131072
tools = true
vision = false
roles = ["small"]
priority = 90
source = "https://console.groq.com/docs/rate-limits (2026-10-22)"

# ---------------------------------------------------------------------------------------
[providers.ollama]
kind = "anthropic"
base_url = "http://127.0.0.1:11434"
key_env = ""                    # local server: no key (Ollama ignores the token)
static_key = "ollama"
enabled = false                 # enable after `ollama pull <model>` and set the model below
free_kind = "local"
privacy = "Runs on this computer; nothing leaves the machine."
# Source: https://docs.ollama.com/api/anthropic-compatibility (checked 2026-10-22):
# /v1/messages with streaming, tools and images; no count_tokens, no prompt caching.
limits = {}

[[providers.ollama.models]]
id = "qwen3-coder:30b"          # example; replace with a model you have pulled
context = 65536
context_verified = false
tools = true
vision = false
roles = ["main", "small"]
priority = 100
source = "User-managed local model. Set `context` to the num_ctx you run it with."
